info:
  name: CreateDeck
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/decks"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Mono Green Gargos",
        "format": "Commander",
        "description": "Meu primeiro deck montado por mim"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
